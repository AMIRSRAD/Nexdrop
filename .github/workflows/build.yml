name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: macOS (Apple silicon)
            os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-13
            bundles: dmg
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build the interface
        run: pnpm build

      - name: Unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexdrop-${{ matrix.os }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
