[package]
name = "nexdrop"
version = "1.0.0"
description = "Nexdrop - Modern Internet Download Manager"
authors = ["Nexdrop Contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "nexdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
url = "2.5"
open = "5.3"
dirs = "5.0"
thiserror = "2.0"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
bytes = "1"
cbc = "0.1"
quick-xml = "0.37"
log = "0.4"
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
