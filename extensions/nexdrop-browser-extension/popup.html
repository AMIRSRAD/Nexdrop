<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexdrop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1118;
      color: #e2e8f0;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .logo-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
    }
    .videos {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .videos-title {
      font-size: 10.5px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .video-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      background: #171b26;
      margin-bottom: 6px;
    }
    .video-row .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: #e2e8f0;
    }
    .video-row .kind {
      flex: none;
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(91, 140, 255, 0.18);
      color: #9db9ff;
    }
    .video-row .size {
      flex: none;
      font-size: 10.5px;
      color: #8b8f9b;
    }
    .more {
      margin-top: 10px;
      text-align: center;
      font-size: 10.5px;
    }
    .more a { color: #8b8f9b; text-decoration: none; }
    .more a:hover { color: #e2e8f0; }
    .btn-small {
      background: #5b8cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-small:hover { background: #7aa2ff; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .status-offline {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.25);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-box {
      width: 100%;
      background: #171b26;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 10px;
      color: #f1f5f9;
      font-size: 11px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: #5b8cff;
    }
    .btn-primary {
      width: 100%;
      background: #5b8cff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #7aa2ff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: #94a3b8;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #334155;
      border-radius: 18px;
      transition: .3s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background: #5b8cff; }
    input:checked + .slider:before { transform: translateX(14px); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img class="logo-badge" src="icons/icon48.png" alt="">
      <span>Nexdrop</span>
    </div>
    <div id="statusBadge" class="status-badge status-offline">
      <span class="dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div id="videos" class="videos" hidden>
    <div class="videos-title">Videos on this page</div>
    <div id="videoList"></div>
  </div>

  <div class="input-group">
    <input id="urlInput" type="text" class="input-box" placeholder="Paste URL to download directly..." />
  </div>

  <button id="downloadBtn" class="btn-primary">Download with Nexdrop</button>

  <div class="toggle-row">
    <span>Auto-intercept downloads</span>
    <label class="switch">
      <input type="checkbox" id="interceptToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="more"><a id="optionsLink" href="#">Capture settings</a></div>

  <script src="popup.js"></script>
</body>
</html>
